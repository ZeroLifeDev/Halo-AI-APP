name: Build Android APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # Surfaced as env because the secrets context isn't usable in step `if`.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # GitHub's runners already carry the Android SDK; this just makes the
      # command-line tools and the licence state predictable.
      - uses: android-actions/setup-android@v3

      - name: Install matching SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Copy web assets into the Android project
        run: npx cap sync android

      # Signing key, if one has been added to the repository secrets.
      # Without it the build falls back to the standard debug key, which
      # still produces a fully installable APK.
      - name: Restore signing keystore
        id: keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/halo-release.jks
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        if: steps.keystore.outputs.signed == 'true'
        working-directory: android
        env:
          HALO_KEYSTORE: halo-release.jks
          HALO_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          HALO_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          HALO_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Build debug APK
        if: steps.keystore.outputs.signed != 'true'
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect the APK
        id: collect
        run: |
          mkdir -p out
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk out/halo-guard.apk
            echo "kind=release" >> "$GITHUB_OUTPUT"
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk out/halo-guard.apk
            echo "kind=debug" >> "$GITHUB_OUTPUT"
          fi
          echo "size=$(du -h out/halo-guard.apk | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: halo-guard-apk
          path: out/halo-guard.apk
          if-no-files-found: error
          retention-days: 90

      # A release gives a permanent, direct download link for the phone —
      # no need to be signed in to Actions to fetch it.
      - name: Publish the APK to a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Halo Guard build ${{ github.run_number }}
          body: |
            Ready-to-install Android app (${{ steps.collect.outputs.kind }} build, ${{ steps.collect.outputs.size }}).

            **Install it**
            1. Download `halo-guard.apk` below on your Android phone.
            2. Open it. If Android asks, allow installing from this source.
            3. Open Halo Guard and sign in.

            Built from `${{ github.sha }}`.
          files: out/halo-guard.apk
          draft: false
          prerelease: false
